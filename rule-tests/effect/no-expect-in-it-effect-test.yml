id: no-expect-in-it-effect

valid:
  - |
    it.effect("parses target", () =>
      Effect.gen(function* () {
        const result = yield* parse("host:1234");
        assert.deepStrictEqual(result, { host: "host", port: 1234 });
      }),
    );

invalid:
  - |
    it.effect("parses target", () =>
      Effect.gen(function* () {
        const result = yield* parse("host:1234");
        expect(result).toEqual({ host: "host", port: 1234 });
      }),
    );
