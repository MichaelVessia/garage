<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#28243c">
    <meta name="description" content="Pick a game from Michael Vessia’s pocket arcade.">
    <title>The Pocket Arcade · Michael Vessia</title>
    <link rel="icon" href="/art/battleblocks.png">
    <link rel="stylesheet" href="./arcade.css">
  </head>
  <body>
    <main>
      <header>
        <p>Michael Vessia’s</p>
        <h1>The Pocket Arcade</h1>
        <div class="lights" aria-hidden="true">✦ &nbsp; ◆ &nbsp; ✦</div>
      </header>
      <ul aria-label="Games">
        <li class="coral">
          <a href="https://battleblocks.vessia.net/">
            <img src="/art/battleblocks.png" alt="" width="96" height="88">
            <div><h2>Battleblocks</h2><p>Draw five cards. Face a friend or a bot across a tiny block arena.</p><strong>Play in browser <span aria-hidden="true">↗</span></strong></div>
          </a>
        </li>
        <li class="mint">
          <a href="https://beltworks.vessia.net/">
            <img src="/art/beltworks.png" alt="" width="96" height="88">
            <div><h2>Beltworks</h2><p>Lay belts, combine numbers, and keep a little factory humming.</p><strong>Play in browser <span aria-hidden="true">↗</span></strong></div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
