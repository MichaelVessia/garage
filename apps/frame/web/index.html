<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f2eee6" />
    <title>Frame</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
    <script>
      // Wall-display self-healing: if the app never mounts (a deploy in progress, a network blip),
      // reload until it does instead of leaving a blank screen. Mounting replaces #root, so an
      // empty #root that is still in the page means the app never started.
      setTimeout(function () {
        var root = document.querySelector('#root')
        if (root && !root.firstElementChild) location.reload()
      }, 15000)
    </script>
  </body>
</html>
