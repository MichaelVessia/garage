name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fast:
    name: Fast validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate:fast

  validate-release:
    name: Release-grade validation
    needs: validate-fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker image prune --all --force
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build deliverables
        run: bun run build

      - name: Smoke Nix deliverables
        run: bash scripts/nix-smoke.sh
