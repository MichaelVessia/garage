name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fast:
    name: Fast validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate:fast

  validate-release:
    name: Release-grade validation
    needs: validate-fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build deliverables
        run: bun run build

      - name: Smoke compiled CLIs
        run: bash scripts/cli-smoke.sh

      - name: Smoke Nix deliverables
        run: bash scripts/nix-smoke.sh
