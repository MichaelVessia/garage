# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-runpromise-in-effect
language: tsx
severity: error
message: "Avoid Effect.runPromise/runSync; use yield* in Effect.gen or run at app boundaries (BunRuntime.runMain)"

rule:
  any:
    - pattern: Effect.runPromise($$$ARGS)
    - pattern: Effect.runSync($$$ARGS)

files:
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "scripts/**/*.ts"

ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/node_modules/**"
