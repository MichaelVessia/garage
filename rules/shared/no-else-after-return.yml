# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-else-after-return
language: tsx
severity: error
message: "Unnecessary else after return - prefer early return pattern"

rule:
  pattern: |
    if ($COND) {
      $$$BODY1
      return $$$RET
    } else {
      $$$BODY2
    }

files:
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "scripts/**/*.ts"

ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/node_modules/**"
